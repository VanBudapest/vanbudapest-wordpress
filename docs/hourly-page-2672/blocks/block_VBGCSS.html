<style>
/* ===================================================================
   VanBudapest.com - Hourly page 2026 - own-photo galleries
   Namespace: .vbg-*   (separate from .vbh-* and from the older
   .vb-section / .vb-fw so none of the three can collide)
   All pictures are VanBudapest's own photographs.
   =================================================================== */
.vbg{
  --vb-navy:#0A1F44; --vb-navy-2:#12306A; --vb-navy-dark:#050E23;
  --vb-gold:#C8B560; --vb-gold-dark:#B78D38; --vb-gold-light:#E5D9A8;
  --vb-font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --vb-font-head:'Montserrat','Segoe UI',system-ui,Arial,sans-serif;
  --vb-font-body:'Open Sans','Segoe UI',Arial,sans-serif;
  font-family:var(--vb-font-body);
  line-height:1.6;
}
.vbg,.vbg *{box-sizing:border-box}
.vbg figure,.vbg figcaption,.vbg p,.vbg h2{margin:0}
.vbg img{max-width:100%;display:block}
.vbg-fw{
  width:100vw;max-width:100vw;
  margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
  margin-top:0;margin-bottom:0;
  position:relative;isolation:isolate;overflow:hidden;
}
.vbg--dark{background:linear-gradient(160deg,#050E23 0%,#0A1F44 55%,#12306A 100%)}
.vbg--deep{background:linear-gradient(200deg,#0A1F44 0%,#050E23 100%)}
.vbg-wrap{max-width:1320px;margin:0 auto;padding:clamp(48px,6vw,84px) clamp(16px,4vw,32px)}
.vbg-wrap--flush{max-width:none;padding-left:0;padding-right:0}

/* ---- heading ---- */
.vbg-eyebrow{
  font:600 12px/1.4 var(--vb-font-head);letter-spacing:.18em;text-transform:uppercase;
  color:var(--vb-gold);text-align:center;margin:0 0 12px !important;
}
.vbg h2{
  font:700 clamp(24px,3.2vw,40px)/1.2 var(--vb-font-display);
  color:#fff;text-align:center;margin:0 0 14px !important;letter-spacing:.2px;
}
.vbg h2 em{font-style:italic;color:var(--vb-gold-light)}
.vbg-lead{
  text-align:center;color:#c3cfe4;max-width:760px;margin:0 auto !important;
  font-size:clamp(14.5px,1.5vw,16px);line-height:1.75;
}
.vbg-rule{
  width:88px;height:2px;margin:22px auto 0;
  background:linear-gradient(90deg,transparent,var(--vb-gold),transparent);
}

/* ---- shared tile ---- */
.vbg-tile{
  position:relative;overflow:hidden;border-radius:14px;
  border:1px solid rgba(200,181,96,.26);
  background:rgba(255,255,255,.04);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:transform .38s ease,border-color .38s ease,box-shadow .38s ease;
}
.vbg-tile img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  transition:transform .6s ease;
}
.vbg-tile:hover{transform:translateY(-5px);border-color:rgba(200,181,96,.62);box-shadow:0 18px 44px rgba(200,181,96,.22)}
.vbg-tile:hover img{transform:scale(1.05)}
.vbg-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:26px 14px 12px;
  font:600 12.5px/1.35 var(--vb-font-head);color:#fff;letter-spacing:.02em;
  background:linear-gradient(180deg,rgba(5,14,35,0) 0%,rgba(5,14,35,.86) 70%);
  opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;
}
.vbg-tile:hover .vbg-cap,.vbg-tile:focus-within .vbg-cap{opacity:1;transform:none}

/* ---- 1. marquee ---- */
.vbg-mq{position:relative;overflow:hidden;padding:6px 0}
.vbg-mq+.vbg-mq{margin-top:14px}
.vbg-mq::before,.vbg-mq::after{
  content:"";position:absolute;top:0;bottom:0;width:11%;z-index:2;pointer-events:none;
}
.vbg-mq::before{left:0;background:linear-gradient(90deg,#050E23,rgba(5,14,35,0))}
.vbg-mq::after{right:0;background:linear-gradient(270deg,#0A1F44,rgba(10,31,68,0))}
.vbg-track{display:flex;gap:14px;width:max-content;animation:vbg-slide 64s linear infinite}
.vbg-mq--rev .vbg-track{animation-direction:reverse}
.vbg-mq:hover .vbg-track{animation-play-state:paused}
@keyframes vbg-slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.vbg-track .vbg-tile{flex:0 0 auto;width:clamp(184px,21vw,286px);aspect-ratio:3/2}

/* ---- 2. cinematic strip ---- */
.vbg-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.vbg-strip .vbg-tile{aspect-ratio:3/4}
.vbg-strip .vbg-tile:nth-child(2),.vbg-strip .vbg-tile:nth-child(3){aspect-ratio:3/4;margin-top:clamp(0px,2.4vw,30px)}

/* ---- 3. bento ---- */
.vbg-bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(104px,11vw,150px);grid-auto-flow:dense;gap:14px;margin-top:34px}
.vbg-bento .vbg-tile{grid-column:span 1;grid-row:span 1}
.vbg-bento .vbg-tile--w2{grid-column:span 2}
.vbg-bento .vbg-tile--h2{grid-row:span 2}

/* ---- 4. mosaic ---- */
.vbg-mosaic{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:14px;margin-top:34px}
.vbg-mosaic .vbg-tile{aspect-ratio:3/2}

/* ---- footnote ---- */
.vbg-foot{
  margin:28px auto 0 !important;text-align:center;color:#9fb0cd;
  font-size:13px;line-height:1.7;max-width:680px;
}
.vbg-foot strong{color:var(--vb-gold-light);font-weight:600}

/* ---- responsive ---- */
@media (max-width:900px){
  .vbg-strip{grid-template-columns:repeat(2,1fr)}
  .vbg-strip .vbg-tile:nth-child(2),.vbg-strip .vbg-tile:nth-child(3){margin-top:0}
  .vbg-bento{grid-template-columns:repeat(2,1fr)}
  .vbg-bento .vbg-tile--w2{grid-column:span 2}
}
@media (max-width:540px){
  .vbg-strip{grid-template-columns:repeat(2,1fr);gap:10px}
  .vbg-bento{gap:10px}
  .vbg-mosaic{grid-template-columns:repeat(2,1fr);gap:10px}
  .vbg-track{gap:10px}
  .vbg-cap{font-size:11.5px;padding:20px 10px 9px}
}
@media (prefers-reduced-motion:reduce){
  .vbg-track{animation:none}
  .vbg-mq{overflow-x:auto}
  .vbg-tile,.vbg-tile img,.vbg-cap{transition:none}
}
</style>
<!-- /wp:html -->
