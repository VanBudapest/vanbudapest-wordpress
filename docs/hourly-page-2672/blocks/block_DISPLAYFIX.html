<style>
/* ===================================================================
   VanBudapest.com - Hourly page - display fixes for every screen size
   2026-08-23. Sits last in the page so it wins on source order; every
   selector repeats the original one, so specificity matches too.

   1. no text below 12px anywhere (the smallest was 8.5px)
   2. inline links get a >=26px tap area without moving any text
   3. the legacy block stops justifying its text on narrow screens
   =================================================================== */

/* --- 1. minimum legible type -------------------------------------- */
.vbh-b .vbh-dur button.tier::after{font-size:11px;letter-spacing:.04em;padding:3px 6px;top:-13px;right:-2px}
.vbh-b .vbh-dur{padding-top:14px}
.vb-hpromo-badge-text{font-size:12px}
.vbh-a .vbh-hours button small{font-size:12px}
.vbh-b .vbh-dur button small{font-size:12px}
.vbh-c .vbh-cat .tag{font-size:12px}
.vbh-c .vbh-rate span{font-size:12px}
.vbh-c .vbh-hours li{font-size:12px}
.vb-dtier-label{font-size:12px}
.vbh-a .vbh-total .lbl{font-size:12px}
.vbh-b .vbh-vcard b{font-size:12px}
.vbh-d .vbh-dc .k{font-size:12px}
.vbh-a .vbh-badge{font-size:12px}
.vbh-b .vbh-vcard .fr{font-size:12px}
.vbh-b .vbh-sum .eyebrow{font-size:12px}
.vbh-b .vbh-sticky .t small{font-size:12px}
.vbh-c .vbh-colhead{font-size:12px}
.vbh-c .vbh-colhead em{font-size:12px}
.vbh-c .vbh-cat{font-size:12px}
.vbh-c .vbh-rate i{font-size:12px}
.vbh-d .vbh-dc .m{font-size:12px}
.vbh-d .vbh-dc .pr small{font-size:12px}
.vb-hpromo-perk{font-size:12px}
.vbh-a .vbh-total .per{font-size:12px}
.vbh-b .vbh-vcard .s{font-size:12px}
.vbh-b .vbh-sum .fine{font-size:12px}
.vbh-c .vbh-legend{font-size:12px}
.vbh-e .vbh-uc .veh{font-size:12px}
.vbg-cap{font-size:12.5px}
.vb-section .vb-inner h6{font-size:13px}

/* --- 2. tap targets ------------------------------------------------
   padding-block on an inline link grows the hit box without changing
   the line box, so nothing on the page moves: 12px -> 26px, 18px -> 32px. */
.vbh-a a:not([class*="cta"]),
.vbh-b a:not([class*="cta"]),
.vbh-c a:not([class*="cta"]),
.vbh-d a:not([class*="cta"]),
.vbh-e a:not([class*="cta"]),
.vbh-f a:not([class*="cta"]),
.vbh-pi a:not([class*="cta"]){padding-block:7px;margin-block:-7px}
.vbh-a .vbh-link{display:inline-flex;align-items:center;min-height:26px}

/* --- 3. no justified text on narrow screens ------------------------ */
@media (max-width:900px){
  .vb-section .vb-inner,
  .vb-section .vb-content,
  .vb-section .vb-inner p,
  .vb-section .vb-content p{text-align:left}
}

/* --- 4. knock-on adjustments the larger type needs ----------------- */
.vbh-b .vbh-vcard .s{flex-wrap:wrap;white-space:normal;row-gap:2px}
.vbh-c .vbh-hours li{letter-spacing:.02em}
.vbh-b .vbh-dur button.tier{overflow:visible}
</style>
